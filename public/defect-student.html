<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Акт дефектации</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#1f2933;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 8px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #b7c0cc;border-radius:6px;font:inherit}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 18px;background:#2563eb;color:#fff}
button.sec{background:#e3e8ef;color:#1f2933}
button:disabled{opacity:.5;cursor:default}
.err{color:#b42318;margin-top:8px}
.muted{color:#667085;font-size:14px}
.act{background:#fff;border:2px solid #34495e;border-radius:4px;padding:0;margin-bottom:14px}
.act-head{background:#34495e;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;letter-spacing:.5px}
.meta{width:100%;border-collapse:collapse;font-size:14px}
.meta td{border:1px solid #cbd2db;padding:6px 10px}
.meta td.k{background:#f3f5f8;color:#475467;width:17%}
.sec-h{margin:0;padding:8px 16px;background:#f3f5f8;border-top:1px solid #cbd2db;border-bottom:1px solid #cbd2db;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:#34495e}
.sec-b{padding:14px 16px}
.obs{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.obs img{width:300px;max-width:100%;border:1px solid #cbd2db;border-radius:6px;background:#fff}
.obs table{flex:1;min-width:240px;border-collapse:collapse;font-size:14px}
.obs td{border:1px solid #cbd2db;padding:7px 10px;vertical-align:top}
.obs td.k{background:#f3f5f8;width:110px}
.val{font-weight:bold}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid #cbd2db;border-radius:6px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:#f7f9fc}
.opt.sel{border-color:#2563eb;background:#eaf1ff}
.opt input{margin-top:3px}
.opt.ok{border-color:#16a34a;background:#e8f7ee}
.opt.bad{border-color:#dc2626;background:#fdecec}
.play{background:#0f766e;margin-top:6px;padding:7px 14px}
.sign{padding:10px 16px;border-top:1px dashed #98a2b3;display:flex;justify-content:space-between;color:#475467;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin:12px 0}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:30px;height:30px;border-radius:50%;background:#d0d5dd;color:#344054;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.dot.done{background:#16a34a;color:#fff}.dot.cur{outline:3px solid #2563eb}
.score{font-size:30px;font-weight:bold;color:#2563eb}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.t-ok{background:#16a34a}.t-bad{background:#dc2626}.t-n{background:#98a2b3}
.explain{background:#fff8e1;border-left:4px solid #f59e0b;padding:8px 12px;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const CODE = location.pathname.split('/')[2];
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = { name: '', pid: null, tasks: [], answers: [], cur: 0, title: '' };

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || j.error || 'Ошибка'); e.code = j.error; e.data = j; throw e; }
  return j;
}

// ---------- звук (синтез в браузере, без аудиофайлов) ----------
let ac = null, stopper = null;
function stopSound() { if (stopper) { try { stopper(); } catch (e) {} stopper = null; } document.querySelectorAll('.play').forEach(b => b.textContent = '▶ Прослушать звук'); }
function playSound(type, btn) {
  if (stopper) { const was = btn.dataset.on; stopSound(); if (was) { btn.dataset.on = ''; return; } }
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  const t0 = ac.currentTime, DUR = 6, nodes = [];
  const master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination); nodes.push(master);
  const osc = (kind, f, g, dest) => { const o = ac.createOscillator(), gn = ac.createGain(); o.type = kind; o.frequency.value = f; gn.gain.value = g; o.connect(gn); gn.connect(dest || master); o.start(t0); o.stop(t0 + DUR); nodes.push(o, gn); return { o, gn }; };
  const noise = (filt, f, q, dest) => {
    const len = ac.sampleRate * 2, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = b; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = filt; fl.frequency.value = f; fl.Q.value = q || 1;
    const gn = ac.createGain(); gn.gain.value = 0;
    s.connect(fl); fl.connect(gn); gn.connect(dest || master); s.start(t0); s.stop(t0 + DUR); nodes.push(s, fl, gn); return gn;
  };
  const lfo = (f, depth, target) => { const l = ac.createOscillator(), g = ac.createGain(); l.frequency.value = f; g.gain.value = depth; l.connect(g); g.connect(target); l.start(t0); l.stop(t0 + DUR); nodes.push(l, g); };
  const burst = (gn, t, peak, dec) => { gn.gain.setValueAtTime(0, t0 + t); gn.gain.linearRampToValueAtTime(peak, t0 + t + 0.004); gn.gain.exponentialRampToValueAtTime(0.001, t0 + t + dec); };

  if (type === 'grinding') {
    const n = noise('bandpass', 1800, 0.7);
    for (let t = 0; t < DUR; t += 0.04) n.gain.setValueAtTime(0.15 + Math.random() * 0.45, t0 + t);
    const c = noise('highpass', 3500, 0.5);
    for (let t = 0.1; t < DUR; t += 0.12 + Math.random() * 0.3) burst(c, t, 0.9, 0.03);
  } else if (type === 'clicking') {
    const c = noise('highpass', 1800, 0.6), th = osc('sine', 70, 0);
    for (let t = 0.2; t < DUR; t += 0.5) { burst(c, t, 1, 0.05); burst(th.gn, t, 0.8, 0.12); }
  } else if (type === 'hum_axial') {
    const a = osc('sine', 55, 0.5); osc('sine', 110, 0.2); lfo(2.5, 0.35, a.gn.gain);
  } else if (type === 'hum_beat') {
    osc('sine', 50, 0.4); osc('sine', 53, 0.4); osc('sine', 100, 0.15);
  } else if (type === 'gravel') {
    const n = noise('bandpass', 3000, 0.5);
    for (let t = 0; t < DUR; t += 0.015) n.gain.setValueAtTime(Math.random() * 0.7, t0 + t);
    noise('lowpass', 200, 0.7).gain.value = 0.2;
  } else if (type === 'knock') {
    const th = osc('sine', 80, 0), n = noise('lowpass', 400, 0.8);
    for (let t = 0.2; t < DUR; t += 0.25 + Math.random() * 0.4) { burst(th.gn, t, 1, 0.18); burst(n, t, 0.9, 0.1); }
  } else if (type === 'whine') {
    const m = osc('sine', 90, 0), c = ac.createOscillator(), cg = ac.createGain();
    m.gn.gain.value = 140; m.gn.disconnect(); m.gn.connect(c.frequency);
    c.frequency.value = 1800; cg.gain.value = 0.35; c.connect(cg); cg.connect(master); c.start(t0); c.stop(t0 + DUR); nodes.push(c, cg);
    osc('sine', 3600, 0.08);
  } else if (type === 'steady_hum') {
    osc('sine', 120, 0.45); osc('sine', 240, 0.25); osc('sine', 360, 0.12); noise('lowpass', 400, 0.7).gain.value = 0.06;
  } else if (type === 'squeal') {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(master); nodes.push(lp);
    const s = osc('sawtooth', 1500, 0.0, lp); lfo(7, 70, s.o.frequency);
    s.gn.gain.setValueAtTime(0, t0); s.gn.gain.linearRampToValueAtTime(0.35, t0 + 0.4); s.gn.gain.setValueAtTime(0.35, t0 + 2); s.gn.gain.linearRampToValueAtTime(0.03, t0 + 4);
    const n = noise('lowpass', 300, 0.7); n.gain.value = 0.1;
  } else if (type === 'hum100') {
    osc('sine', 100, 0.5); osc('sine', 200, 0.22); osc('sine', 300, 0.1);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; lp.connect(master); nodes.push(lp); osc('square', 100, 0.1, lp);
  } else {
    osc('sine', 120, 0.4);
  }
  btn.dataset.on = '1'; btn.textContent = '■ Остановить';
  const timer = setTimeout(() => { stopSound(); btn.dataset.on = ''; }, DUR * 1000);
  stopper = () => { clearTimeout(timer); master.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => nodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch (e) {} }), 150); btn.dataset.on = ''; };
}

// ---------- вход ----------
async function init() {
  const saved = localStorage.getItem('defect_pid_' + CODE);
  if (saved) {
    try { const r = await api(`/api/defect-sessions/${CODE}/result?participantId=${encodeURIComponent(saved)}`); if (r.finished) return showResult(r); } catch (e) {}
  }
  try {
    const info = await api(`/api/defect-sessions/${CODE}/info`);
    $app.innerHTML = `<div class="card"><h1>${esc(info.testTitle)}</h1><p>${esc(info.intro)}</p>
      <p class="muted">Актов дефектации: ${info.taskCount}. В каждом: осмотр узла, диагноз, причина, описание неисправности своими словами и рекомендуемые действия.</p>
      <input type="text" id="nm" placeholder="Ваши фамилия и имя" maxlength="80"><div class="err" id="er"></div>
      <p><button id="go">Начать</button></p></div>`;
    document.getElementById('go').onclick = join;
  } catch (e) { $app.innerHTML = `<div class="card"><h1>Недоступно</h1><p>${esc(e.message)}</p></div>`; }
}

async function join() {
  const name = document.getElementById('nm').value.trim();
  const er = document.getElementById('er');
  if (!name) { er.textContent = 'Введите имя'; return; }
  try {
    const r = await api(`/api/defect-sessions/${CODE}/join`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    state = { name, pid: r.participantId, tasks: r.tasks, title: r.testTitle, cur: 0, answers: r.tasks.map(() => ({ diag: '', cause: '', desc: '', actions: '' })) };
    localStorage.setItem('defect_pid_' + CODE, r.participantId);
    renderAct();
  } catch (e) { er.textContent = e.message; }
}

// ---------- бланк ----------
const answered = a => a.diag && a.desc.trim();
function renderAct() {
  stopSound();
  const t = state.tasks[state.cur], a = state.answers[state.cur], n = state.tasks.length, last = state.cur === n - 1;
  const dots = state.tasks.map((_, i) => `<div class="dot ${answered(state.answers[i]) ? 'done' : ''} ${i === state.cur ? 'cur' : ''}" data-i="${i}">${i + 1}</div>`).join('');
  const radios = (q, key) => q.options.map(o => `<label class="opt ${a[key] === o.id ? 'sel' : ''}"><input type="radio" name="${key}" value="${o.id}" ${a[key] === o.id ? 'checked' : ''}><span>${esc(o.text)}</span></label>`).join('');
  $app.innerHTML = `<div class="dots">${dots}</div>
  <div class="act">
    <div class="act-head"><span>АКТ ДЕФЕКТАЦИИ № ${state.cur + 1}</span><span>${state.cur + 1} / ${n}</span></div>
    <table class="meta"><tr><td class="k">Объект</td><td>${esc(t.title)}</td><td class="k">Дата</td><td>${new Date().toLocaleDateString('ru-RU')}</td></tr>
      <tr><td class="k">Узел</td><td>${esc(t.node)}</td><td class="k">Исполнитель</td><td>${esc(state.name)}</td></tr></table>
    <h3 class="sec-h">1. Результаты осмотра и измерений</h3>
    <div class="sec-b"><div class="obs">
      ${t.schemeUrl ? `<img src="${esc(t.schemeUrl)}" alt="Схема узла">` : ''}
      <table>
        <tr><td class="k">Вибрация</td><td><span class="val">${esc(t.vibration.value)}</span><br>${esc(t.vibration.desc)}</td></tr>
        <tr><td class="k">Температура</td><td><span class="val">${esc(t.temp.value)}</span><br>${esc(t.temp.desc)}</td></tr>
        <tr><td class="k">Звук</td><td>${esc(t.sound.desc)}<br><button class="play" id="pl">▶ Прослушать звук</button></td></tr>
      </table></div></div>
    <h3 class="sec-h">2. Заключение о неисправности</h3>
    <div class="sec-b"><p><b>${esc(t.diag.question)}</b></p>${radios(t.diag, 'diag')}</div>
    ${t.cause ? `<h3 class="sec-h">3. Вероятная причина</h3><div class="sec-b"><p><b>${esc(t.cause.question)}</b></p>${radios(t.cause, 'cause')}</div>` : ''}
    <h3 class="sec-h">${t.cause ? 4 : 3}. Описание неисправности <span class="muted" style="text-transform:none">(своими словами)</span></h3>
    <div class="sec-b"><textarea id="desc" placeholder="Опишите, что с узлом, по каким признакам вы это определили">${esc(a.desc)}</textarea></div>
    <h3 class="sec-h">${t.cause ? 5 : 4}. Рекомендуемые действия</h3>
    <div class="sec-b"><textarea id="actions" placeholder="Что нужно сделать для устранения неисправности">${esc(a.actions)}</textarea></div>
    <div class="sign"><span>Исполнитель: ${esc(state.name)}</span><span>Подпись: ____________</span></div>
  </div>
  <div class="nav"><button class="sec" id="prev" ${state.cur === 0 ? 'disabled' : ''}>← Назад</button>
    ${last ? '<button id="fin">Сдать все акты</button>' : '<button id="next">Далее →</button>'}</div>
  <div class="err" id="er"></div>`;
  document.getElementById('pl').onclick = e => playSound(t.sound.type, e.target);
  document.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { a[r.name] = r.value; renderKeep(); });
  document.getElementById('desc').oninput = e => { a.desc = e.target.value; };
  document.getElementById('actions').oninput = e => { a.actions = e.target.value; };
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => { state.cur = +d.dataset.i; renderAct(); });
  document.getElementById('prev').onclick = () => { state.cur--; renderAct(); window.scrollTo(0, 0); };
  if (last) document.getElementById('fin').onclick = finish; else document.getElementById('next').onclick = () => { state.cur++; renderAct(); window.scrollTo(0, 0); };
}
function renderKeep() { const y = window.scrollY; renderAct(); window.scrollTo(0, y); }

async function finish() {
  const empty = state.answers.map((a, i) => (answered(a) ? 0 : i + 1)).filter(Boolean);
  if (empty.length && !confirm(`Не заполнены (диагноз и описание) акты: ${empty.join(', ')}. Всё равно сдать?`)) return;
  try {
    const r = await api(`/api/defect-sessions/${CODE}/submit`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ participantId: state.pid, answers: state.answers }) });
    showResult(r);
  } catch (e) { document.getElementById('er').textContent = e.message; }
}

// ---------- результат ----------
function showResult(r) {
  stopSound();
  const opts = (q) => q.options.map(o => {
    const cls = o.id === q.correct ? 'ok' : (o.id === q.given ? 'bad' : '');
    return `<div class="opt ${cls}"><span>${o.id === q.correct ? '✔' : (o.id === q.given ? '✘' : '•')}</span><span>${esc(o.text)}</span></div>`;
  }).join('');
  const items = r.review.map((it, i) => `<div class="card"><h3 style="margin-top:0">Акт № ${i + 1}. ${esc(it.title)}</h3>
    <p><b>${esc(it.diag.question)}</b> <span class="tag ${it.diag.ok ? 't-ok' : 't-bad'}">${it.diag.ok ? 'верно' : 'неверно'}</span></p>${opts(it.diag)}
    ${it.cause ? `<p><b>${esc(it.cause.question)}</b> <span class="tag ${it.cause.ok ? 't-ok' : 't-bad'}">${it.cause.ok ? 'верно' : 'неверно'}</span></p>${opts(it.cause)}` : ''}
    <div class="explain">${esc(it.explain)}</div>
    <p><b>Ваше описание:</b><br>${esc(it.desc) || '<span class="muted">не заполнено</span>'}</p>
    <p><b>Ваши действия:</b><br>${esc(it.actions) || '<span class="muted">не заполнено</span>'}</p>
    <p>Оценка преподавателя: ${it.textGrade === true ? '<span class="tag t-ok">зачёт</span>' : it.textGrade === false ? '<span class="tag t-bad">незачёт</span>' : '<span class="tag t-n">ожидает проверки</span>'}</p></div>`).join('');
  $app.innerHTML = `<div class="card"><h1>Акты сданы</h1>
    <div class="score">${r.score} из ${r.total}</div><div class="muted">баллов за выбор диагноза и причины (проверено автоматически)</div>
    <p>Описания неисправностей проверяет преподаватель: ${r.graded ? `зачтено <b>${r.manualScore}</b> из ${r.manualTotal}` : 'оценка появится после проверки, обновите страницу позже'}.</p>
    ${r.gradeComment ? `<p><b>Комментарий преподавателя:</b> ${esc(r.gradeComment)}</p>` : ''}</div>${items}`;
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
