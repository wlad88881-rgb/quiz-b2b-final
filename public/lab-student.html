<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: system-ui, sans-serif; }
  body { background:#F4F4F4; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card { background:#fff; border-radius:16px; padding:30px; max-width:420px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
  h1 { color:#2C3E50; font-size:20px; margin-bottom:10px; }
  p { color:#888; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>Модуль тренажёров в разработке</h1>
    <p>Эта функция появится в одном из следующих обновлений. Пожалуйста, воспользуйтесь обычным тестированием по QR-коду.</p>
  </div>
</body>
</html>
