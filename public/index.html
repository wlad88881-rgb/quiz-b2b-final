<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Тестирование</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f5f7fa; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .app-wrapper { max-width: 900px; width: 100%; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; height: fit-content; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-email { font-weight: 600; font-size: 15px; }
    .user-plan { font-size: 12px; background: #e6f4ea; color: #2e9e4f; padding: 2px 10px; border-radius: 12px; }
    
    .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .tab-btn { background: none; border: none; font-size: 15px; font-weight: 600; color: #888; cursor: pointer; padding: 0; }
    .tab-btn.active { color: #2C3E50; position: relative; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -12px; left: 0; right: 0; height: 3px; background: #F07C00; }

    .card { background: #fff; border: 1px solid #eef2f6; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .muted { color: #888; font-size: 14px; }
    .hidden { display: none !important; }
    
    .btn { display: inline-block; background: #F07C00; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn.outline { background: transparent; border: 1px solid #ddd; color: #333; }
    .btn.danger { background: #d64545; }
    .btn.small { padding: 4px 12px; font-size: 12px; }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.live { background: #e6f4ea; color: #2e9e4f; }
    
    .code-big { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: #F07C00; margin: 8px 0; }
    #qr-img { width: 120px; height: 120px; border: 1px solid #eee; border-radius: 8px; }
    #session-link { font-size: 12px; word-break: break-all; color: #F07C00; text-decoration: underline; }
    .error { color: #d64545; margin-top: 6px; font-size: 14px; }
    
    #results-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    #results-table th, #results-table td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    #results-table th { font-weight: 600; background: #f8f9fa; }

    input[type="text"], input[type="email"], input[type="password"], textarea { 
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; font-size: 15px; 
    }
    .question-block { background: #fafbfc; border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .option-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
    .option-row input[type="text"] { flex: 1; margin-bottom: 0; }
    .option-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="user-info">
      <div class="user-email" id="company-display">Компания</div>
      <span class="user-plan" id="plan-badge">Free</span>
    </div>
    <button class="btn outline small" onclick="logout()">Выход</button>
  </div>

  <!-- Экран входа -->
  <div id="auth-screen" class="hidden">
    <div style="max-width: 400px; margin: 40px auto; text-align: center;">
      <h2 id="auth-title" style="margin-bottom: 16px;">Вход в систему</h2>
      <div id="auth-error" class="error" style="display:none;"></div>
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Пароль">
      <input type="text" id="auth-name" placeholder="Название компании" style="display:none;">
      <button class="btn" onclick="submitAuth()" id="auth-btn" style="width:100%;">Войти</button>
      <div style="margin-top:12px; font-size:14px;">
        <span id="auth-switch">Нет аккаунта? <a onclick="toggleAuthMode()" style="color:#F07C00; cursor:pointer;">Зарегистрироваться</a></span>
      </div>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="screen-main" class="hidden">
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-tests" onclick="switchTab('tests')">📚 Тесты</button>
      <button class="tab-btn" id="tab-btn-labs" onclick="switchTab('labs')">🧪 Тренажёры</button>
      <button class="tab-btn" id="tab-btn-stats" onclick="switchTab('stats')">📊 Статистика</button>
    </div>

    <div id="screen-list">
      <div id="tab-tests">
        <div class="row" style="margin-bottom:16px;">
          <button class="btn" onclick="showEditor()">+ Новый тест</button>
          <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none;" onchange="importFromExcel()">
          <button class="btn outline" onclick="document.getElementById('import-file').click()">Импорт Excel</button>
          <button class="btn outline" onclick="window.location.href='/api/import-template'">Шаблон Excel</button>
        </div>
        <h2 style="font-size:18px; margin-bottom:12px;">Мои тесты</h2>
        <div id="tests-list"></div>
      </div>
      <div id="tab-labs" class="hidden">
        <div class="row" style="margin-bottom:16px;">
          <button class="btn" onclick="showLabEditor()">+ Новый тренажёр</button>
        </div>
        <h2 style="font-size:18px; margin-bottom:12px;">Мои тренажёры</h2>
        <div id="labs-list"></div>
      </div>
    </div>

    <!-- Редактор -->
    <div id="screen-editor" class="hidden">
      <div class="row between" style="margin-bottom:12px;">
        <h2 id="editor-title" style="margin:0;">Новый тест</h2>
        <button class="btn outline small" onclick="showList()">Отмена</button>
      </div>
      <input type="text" id="test-title" placeholder="Название теста">
      <div id="questions-container"></div>
      <button class="btn" onclick="saveTest()">Сохранить тест</button>
      <div id="save-error" class="error"></div>
    </div>

    <!-- Сессия -->
    <div id="screen-session" class="hidden">
      <div class="row between" style="margin-bottom:12px;">
        <div class="row">
          <button class="btn outline small" onclick="showList()">← Назад</button>
          <h2 id="session-title" style="margin:0;">Сессия</h2>
        </div>
        <div class="row">
          <span id="session-status" class="badge live">Идёт тестирование</span>
          <button class="btn danger" id="end-session-btn" onclick="endSession()">Завершить</button>
        </div>
      </div>
      <div class="card">
        <div class="row between">
          <div>
            <div class="muted">Код</div>
            <div class="code-big" id="session-code"></div>
          </div>
          <div style="text-align:center;">
            <img id="qr-img" src="" alt="QR">
            <div class="muted" style="font-size:11px;">Ссылка</div>
            <a id="session-link" href="#" target="_blank"></a>
          </div>
          <button class="btn outline small" onclick="exportResults()">📥 Excel</button>
        </div>
      </div>
      <div id="no-participants" class="muted" style="text-align:center; padding:30px 0;">Пока никто не присоединился.</div>
      <table id="results-table" class="hidden">
        <thead><tr><th>Участник</th><th>Статус</th><th>Результат</th></tr></thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // АВТОРИЗАЦИЯ
  let isRegisterMode = false;
  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
    document.getElementById('auth-btn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
    document.getElementById('auth-switch').innerHTML = isRegisterMode 
      ? 'Есть аккаунт? <a onclick="toggleAuthMode()">Войти</a>'
      : 'Нет аккаунта? <a onclick="toggleAuthMode()">Зарегистрироваться</a>';
    document.getElementById('auth-name').style.display = isRegisterMode ? 'block' : 'none';
  }

  async function submitAuth() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();
    const name = document.getElementById('auth-name').value.trim();
    const errorEl = document.getElementById('auth-error');
    errorEl.style.display = 'none';
    if (!email || !password) {
      errorEl.textContent = 'Заполните email и пароль';
      errorEl.style.display = 'block';
      return;
    }
    const endpoint = isRegisterMode ? '/api/register' : '/api/login';
    const body = isRegisterMode ? { email, password, name } : { email, password };
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Ошибка';
      errorEl.style.display = 'block';
      return;
    }
    localStorage.setItem('b2bCompanyId', data.companyId);
    localStorage.setItem('b2bEmail', data.email);
    localStorage.setItem('b2bPlan', data.plan);
    if (isRegisterMode) {
      alert('Зарегистрировано! Теперь войдите.');
      toggleAuthMode();
      return;
    }
    enterApp();
  }

  function enterApp() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('screen-main').classList.remove('hidden');
    document.getElementById('company-display').textContent = localStorage.getItem('b2bEmail') || 'Компания';
    loadTestsList();
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const savedId = localStorage.getItem('b2bCompanyId');
    if (savedId) {
      const res = await fetch('/api/me', { headers: { 'x-company-id': savedId } });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('b2bPlan', data.plan);
        enterApp();
        return;
      }
    }
    document.getElementById('auth-screen').classList.remove('hidden');
  });

  // ОСНОВНЫЕ ФУНКЦИИ
  function showList() {
    document.getElementById('screen-list').classList.remove('hidden');
    document.getElementById('screen-editor').classList.add('hidden');
    document.getElementById('screen-session').classList.add('hidden');
    loadTestsList();
  }

  async function loadTestsList() {
    const companyId = localStorage.getItem('b2bCompanyId');
    const res = await fetch('/api/tests', { headers: { 'x-company-id': companyId } });
    if (!res.ok) return;
    const tests = await res.json();
    const container = document.getElementById('tests-list');
    if (tests.length === 0) {
      container.innerHTML = '<div class="muted" style="padding:30px 0; text-align:center;">Тестов пока нет.</div>';
    } else {
      container.innerHTML = tests.map(t => `
        <div class="card row between">
          <div>
            <strong>${escapeHtml(t.title)}</strong>
            <div class="muted">${t.questions.length} вопрос(ов)</div>
          </div>
          <div class="row">
            <button class="btn small" onclick="startSession('${t.id}')">Начать сессию</button>
            <button class="btn outline small" onclick="editTest('${t.id}')">Изменить</button>
            <button class="btn danger small" onclick="deleteTest('${t.id}')">Удалить</button>
          </div>
        </div>
      `).join('');
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-btn-' + tab));
    document.getElementById('tab-tests').classList.toggle('hidden', tab !== 'tests');
    document.getElementById('tab-labs').classList.toggle('hidden', tab !== 'labs');
  }

  // РЕДАКТОР
  let editingTestId = null;

  function showEditor() {
    editingTestId = null;
    document.getElementById('editor-title').textContent = 'Новый тест';
    document.getElementById('test-title').value = '';
    document.getElementById('questions-container').innerHTML = '';
    document.getElementById('save-error').textContent = '';
    addQuestion();
    document.getElementById('screen-list').classList.add('hidden');
    document.getElementById('screen-editor').classList.remove('hidden');
  }

  async function editTest(id) {
    const companyId = localStorage.getItem('b2bCompanyId');
    const res = await fetch('/api/tests/' + id, { headers: { 'x-company-id': companyId } });
    const test = await res.json();
    editingTestId = id;
    document.getElementById('editor-title').textContent = 'Редактирование';
    document.getElementById('test-title').value = test.title;
    document.getElementById('questions-container').innerHTML = '';
    test.questions.forEach(q => addQuestion(q));
    document.getElementById('screen-list').classList.add('hidden');
    document.getElementById('screen-editor').classList.remove('hidden');
  }

  function addQuestion(existing) {
    const wrap = document.createElement('div');
    wrap.className = 'question-block';
    const optionsHtml = (existing ? existing.options : ['', '']).map((opt, i) => `
      <div class="option-row">
        <input type="checkbox" class="opt-correct">
        <input type="text" class="opt-text" value="${escapeHtml(opt || '')}" placeholder="Вариант ${i+1}">
        <button class="btn outline small" onclick="this.parentElement.remove()">✕</button>
      </div>
    `).join('');
    
    wrap.innerHTML = `
      <div class="row between">
        <label style="font-weight:600;">Вопрос</label>
        <button class="btn outline small" onclick="this.closest('.question-block').remove()">✕</button>
      </div>
      <input type="text" class="q-text" value="${existing ? escapeHtml(existing.text) : ''}" placeholder="Текст вопроса">
      <div class="options-container">${optionsHtml}</div>
      <button class="btn outline small" style="margin-top:6px;" onclick="addOption(this.closest('.question-block'))">+ Вариант</button>
    `;
    document.getElementById('questions-container').appendChild(wrap);
    if (existing && existing.correct !== undefined) {
      const correctIdx = Array.isArray(existing.correct) ? existing.correct[0] : existing.correct;
      const cb = wrap.querySelectorAll('.opt-correct')[correctIdx];
      if (cb) cb.checked = true;
    }
  }

  function addOption(block) {
    const container = block.querySelector('.options-container');
    const div = document.createElement('div');
    div.className = 'option-row';
    div.innerHTML = `
      <input type="checkbox" class="opt-correct">
      <input type="text" class="opt-text" placeholder="Вариант">
      <button class="btn outline small" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(div);
  }

  async function saveTest() {
    const title = document.getElementById('test-title').value.trim();
    const companyId = localStorage.getItem('b2bCompanyId');
    const errorEl = document.getElementById('save-error');
    errorEl.textContent = '';
    if (!title) { errorEl.textContent = 'Введите название'; return; }

    const blocks = document.querySelectorAll('.question-block');
    const questions = [];
    for (const block of blocks) {
      const text = block.querySelector('.q-text').value.trim();
      const options = [];
      const correctIdxs = [];
      block.querySelectorAll('.option-row').forEach((row, i) => {
        const val = row.querySelector('.opt-text').value.trim();
        if (val) {
          options.push(val);
          if (row.querySelector('.opt-correct').checked) correctIdxs.push(i);
        }
      });
      if (!text || options.length < 2 || correctIdxs.length === 0) {
        errorEl.textContent = 'В каждом вопросе должен быть текст, минимум 2 варианта и отмечен правильный.';
        return;
      }
      questions.push({ text, options, correct: correctIdxs[0] || 0, multi: false });
    }

    const payload = { title, questions };
    const url = editingTestId ? '/api/tests/' + editingTestId : '/api/tests';
    const method = editingTestId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-company-id': companyId },
      body: JSON.stringify(payload)
    });
    if (res.ok) showList();
  }

  // СЕССИЯ
  async function startSession(testId) {
    const companyId = localStorage.getItem('b2bCompanyId');
    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-company-id': companyId },
      body: JSON.stringify({ testId })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Ошибка');
      return;
    }
    openSession(data.session, data.url, data.qrDataUrl);
  }

  function openSession(session, url, qrDataUrl) {
    document.getElementById('screen-list').classList.add('hidden');
    document.getElementById('screen-session').classList.remove('hidden');
    document.getElementById('session-title').textContent = session.testTitle;
    document.getElementById('session-code').textContent = session.code;
    document.getElementById('qr-img').src = qrDataUrl;
    const linkEl = document.getElementById('session-link');
    linkEl.textContent = url;
    linkEl.href = url;
    document.getElementById('no-participants').classList.remove('hidden');
    document.getElementById('results-table').classList.add('hidden');
  }

  function deleteTest(id) {
    if (!confirm('Удалить тест?')) return;
    const companyId = localStorage.getItem('b2bCompanyId');
    fetch('/api/tests/' + id, { method: 'DELETE', headers: { 'x-company-id': companyId } })
      .then(() => loadTestsList());
  }

  function endSession() { alert('Завершение в разработке.'); }
  function exportResults() { alert('Экспорт в разработке.'); }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
