<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>
<link rel="manifest" href="/manifest-admin.json">
<meta name="theme-color" content="#2C3E50">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-admin-192.png">
<link rel="apple-touch-icon" href="/icons/icon-admin-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Админка">
<style>
  :root { --navy:#2C3E50; --orange:#F07C00; --gray:#F4F4F4; }
  * { box-sizing:border-box; margin:0; padding:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background:var(--gray); min-height:100vh; padding:20px; }
  .wrap { max-width:1000px; margin:0 auto; }
  .hidden { display:none !important; }
  h1 { color:var(--navy); font-size:22px; margin-bottom:16px; }
  .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,0.05); margin-bottom:16px; }
  .login-card { max-width:360px; margin:60px auto 0; }
  input[type="password"], input[type="text"] { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:15px; margin-bottom:12px; }
  .btn { background:var(--orange); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.outline { background:#fff; border:1px solid #ddd; color:var(--navy); }
  .btn.danger { background:#d64545; }
  .btn.small { padding:6px 12px; font-size:12.5px; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .error { color:#d64545; font-size:13.5px; margin-bottom:10px; min-height:16px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row.between { justify-content:space-between; }
  .muted { color:#888; font-size:13px; }
  .overview { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .overview .stat { flex:1; min-width:120px; background:#fff; border-radius:12px; padding:16px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,0.05); }
  .overview .stat .num { font-size:26px; font-weight:800; color:var(--navy); }
  .overview .stat .label { font-size:12.5px; color:#888; margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eee; vertical-align:middle; }
  th { color:#888; font-weight:600; font-size:12px; text-transform:uppercase; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .badge.free { background:#eef4fb; color:#2C3E50; }
  .badge.unlimited { background:#e6f4ea; color:#2e9e4f; }
  .badge.blocked { background:#fdecea; color:#d64545; }
  .progress-mini { width:80px; height:6px; background:#eee; border-radius:3px; overflow:hidden; display:inline-block; margin-right:6px; vertical-align:middle; }
  .progress-mini .fill { height:100%; background:var(--orange); }
  .logout-link { color:#888; font-size:13px; cursor:pointer; text-decoration:underline; }
  .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-login" class="card login-card">
    <h1>Вход в админ-панель</h1>
    <input type="password" id="admin-password" placeholder="Пароль администратора">
    <div class="error" id="login-error"></div>
    <button class="btn" style="width:100%;" onclick="adminLogin()">Войти</button>
  </div>

  <div id="screen-dashboard" class="hidden">
    <div class="top-row">
      <h1>Админ-панель</h1>
      <div class="row" style="gap:12px;">
        <button class="btn outline small" onclick="downloadBackup()">📥 Скачать бэкап базы</button>
        <input type="file" id="restore-file-input" accept="application/json,.json" style="display:none;" onchange="handleRestoreFile(this)">
        <button class="btn outline small" onclick="document.getElementById('restore-file-input').click()">📤 Восстановить из бэкапа</button>
        <span class="logout-link" onclick="adminLogout()">Выйти</span>
      </div>
    </div>

    <div class="overview" id="overview"></div>

    <div class="card">
      <div class="row between" style="margin-bottom:12px;">
        <strong style="color:var(--navy);">Компании</strong>
        <button class="btn outline small" onclick="loadCompanies()">Обновить</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Компания</th>
              <th>Тариф</th>
              <th>Тесты</th>
              <th>Попытки сдачи</th>
              <th>Регистрация</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="companies-body"></tbody>
        </table>
      </div>
      <div class="muted" id="companies-empty" style="padding:20px 0; text-align:center;">Загрузка...</div>
    </div>
  </div>

</div>

<script>
  function getToken() { return localStorage.getItem('b2bAdminToken'); }
  function setToken(t) { localStorage.setItem('b2bAdminToken', t); }
  function clearToken() { localStorage.removeItem('b2bAdminToken'); }

  function escapeHtml(s) {
    return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  async function adminLogin() {
    const password = document.getElementById('admin-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if (!password) { errEl.textContent = 'Введите пароль'; return; }
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Ошибка входа'; return; }
      setToken(data.token);
      enterDashboard();
    } catch (e) {
      errEl.textContent = 'Не удалось подключиться к серверу';
    }
  }

  function adminLogout() {
    clearToken();
    document.getElementById('screen-dashboard').classList.add('hidden');
    document.getElementById('screen-login').classList.remove('hidden');
    document.getElementById('admin-password').value = '';
  }

  async function adminFetch(url, options) {
    const token = getToken();
    const opts = options || {};
    opts.headers = Object.assign({}, opts.headers, { 'x-admin-token': token });
    const res = await fetch(url, opts);
    if (res.status === 401) {
      clearToken();
      adminLogout();
      throw new Error('unauthorized');
    }
    return res;
  }

  async function downloadBackup() {
    try {
      const res = await adminFetch('/api/admin/backup');
      if (!res.ok) { alert('Не удалось скачать бэкап'); return; }
      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="([^"]+)"/);
      const filename = match ? match[1] : `quiz-b2b-backup-${Date.now()}.json`;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      if (e.message !== 'unauthorized') alert('Ошибка при скачивании бэкапа');
    }
  }

  function handleRestoreFile(inputEl) {
    const file = inputEl.files && inputEl.files[0];
    inputEl.value = ''; // сброс, чтобы можно было выбрать тот же файл повторно при необходимости
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      let parsed;
      try {
        parsed = JSON.parse(e.target.result);
      } catch (err) {
        alert('Не удалось прочитать файл — это не корректный JSON.');
        return;
      }
      const companiesCount = parsed.companies ? Object.keys(parsed.companies).length : 0;
      const testsCount = parsed.tests ? Object.keys(parsed.tests).length : 0;
      const sessionsCount = parsed.sessions ? Object.keys(parsed.sessions).length : 0;

      const step1 = confirm(
        `В файле обнаружено:\n— компаний: ${companiesCount}\n— тестов: ${testsCount}\n— сессий: ${sessionsCount}\n\n` +
        `ВНИМАНИЕ: восстановление ПОЛНОСТЬЮ заменит текущую базу данных содержимым этого файла. ` +
        `Всё, что появилось на платформе ПОСЛЕ создания этого бэкапа, будет безвозвратно удалено.\n\n` +
        `Продолжить?`
      );
      if (!step1) return;
      const step2 = confirm('Вы точно уверены? Это последнее подтверждение — отменить восстановление после него будет нельзя.');
      if (!step2) return;

      try {
        const res = await adminFetch('/api/admin/restore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: e.target.result
        });
        const data = await res.json();
        if (!res.ok) {
          alert('Ошибка восстановления: ' + (data.error || 'неизвестная ошибка'));
          return;
        }
        alert(`Готово! Восстановлено:\nкомпаний — ${data.companies}\nтестов — ${data.tests}\nсессий — ${data.sessions}\nтренажёров — ${data.labs}`);
        loadOverview();
        loadCompanies();
      } catch (err) {
        if (err.message !== 'unauthorized') alert('Ошибка при восстановлении бэкапа');
      }
    };
    reader.readAsText(file);
  }

  function enterDashboard() {
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-dashboard').classList.remove('hidden');
    loadOverview();
    loadCompanies();
  }

  async function loadOverview() {
    try {
      const res = await adminFetch('/api/admin/overview');
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('overview').innerHTML = `
        <div class="stat"><div class="num">${data.companies}</div><div class="label">Компаний</div></div>
        <div class="stat"><div class="num">${data.tests}</div><div class="label">Тестов</div></div>
        <div class="stat"><div class="num">${data.sessions}</div><div class="label">Сессий</div></div>
        <div class="stat"><div class="num">${data.labs}</div><div class="label">Тренажёров</div></div>
      `;
    } catch (e) {}
  }

  async function loadCompanies() {
    const emptyEl = document.getElementById('companies-empty');
    const body = document.getElementById('companies-body');
    emptyEl.textContent = 'Загрузка...';
    emptyEl.classList.remove('hidden');
    body.innerHTML = '';
    try {
      const res = await adminFetch('/api/admin/companies');
      if (!res.ok) { emptyEl.textContent = 'Не удалось загрузить список'; return; }
      const list = await res.json();
      if (list.length === 0) {
        emptyEl.textContent = 'Пока нет зарегистрированных компаний';
        return;
      }
      emptyEl.classList.add('hidden');
      body.innerHTML = list.map(c => {
        const pct = c.submissionsLimit ? Math.min(100, Math.round(c.submissions / c.submissionsLimit * 100)) : 0;
        const planBadge = c.blocked
          ? '<span class="badge blocked">Заблокирован</span>'
          : (c.plan === 'unlimited' ? '<span class="badge unlimited">Безлимит</span>' : '<span class="badge free">Free</span>');
        const usageCell = c.plan === 'unlimited'
          ? '<span class="muted">—</span>'
          : `<span class="progress-mini"><span class="fill" style="width:${pct}%;"></span></span>${c.submissions}/${c.submissionsLimit}`;
        return `
          <tr>
            <td><strong>${escapeHtml(c.name)}</strong><br><span class="muted">${escapeHtml(c.email)}</span></td>
            <td>${planBadge}</td>
            <td>${c.testsCount}</td>
            <td>${usageCell}</td>
            <td class="muted">${fmtDate(c.registeredAt)}</td>
            <td>
              <div class="row">
                ${c.plan === 'unlimited'
                  ? `<button class="btn outline small" onclick="setPlan('${c.id}','free')">Вернуть Free</button>`
                  : `<button class="btn small" onclick="setPlan('${c.id}','unlimited')">Дать безлимит</button>`}
                ${c.blocked
                  ? `<button class="btn outline small" onclick="setBlocked('${c.id}',false)">Разблокировать</button>`
                  : `<button class="btn outline small" onclick="setBlocked('${c.id}',true)">Заблокировать</button>`}
                <button class="btn outline small" onclick="resetUsage('${c.id}')">Сбросить счётчик</button>
                <button class="btn danger small" onclick="deleteCompany('${c.id}','${escapeHtml(c.email)}')">Удалить</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    } catch (e) {
      emptyEl.textContent = 'Ошибка соединения с сервером';
    }
  }

  async function setPlan(id, plan) {
    await adminFetch(`/api/admin/companies/${id}/plan`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan })
    });
    loadCompanies();
  }
  async function setBlocked(id, blocked) {
    await adminFetch(`/api/admin/companies/${id}/block`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ blocked })
    });
    loadCompanies();
  }
  async function resetUsage(id) {
    if (!confirm('Сбросить счётчик попыток сдачи для этой компании?')) return;
    await adminFetch(`/api/admin/companies/${id}/reset-usage`, { method: 'POST' });
    loadCompanies();
  }
  async function deleteCompany(id, email) {
    if (!confirm(`Удалить компанию ${email} со всеми тестами и результатами? Это необратимо.`)) return;
    await adminFetch(`/api/admin/companies/${id}`, { method: 'DELETE' });
    loadCompanies();
    loadOverview();
  }

  if (getToken()) {
    enterDashboard();
  }
  document.getElementById('admin-password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') adminLogin();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('SW не зарегистрирован:', e));
    });
  }
</script>
</body>
</html>
