<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Задание по квалитетам</title>
<meta name="theme-color" content="#2C3E50">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root { --navy: #2C3E50; --orange: #F07C00; --gray: #F4F4F4; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  html, body { height: 100%; }
  body { background: var(--gray); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
  .wrap { max-width: 560px; width: 100%; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 24px; margin: 20px 0 40px; }
  .hidden { display: none !important; }
  h1 { font-size: 20px; color: var(--navy); margin-bottom: 6px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  .muted { color: #888; font-size: 13px; }

  input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 12px; font-family: inherit; }
  .btn { display: inline-block; background: var(--orange); color: #fff; border: none; padding: 13px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.navy { background: var(--navy); }
  .btn.outline { background: #fff; color: var(--navy); border: 1px solid #ddd; width: auto; padding: 10px 16px; }

  .error-box { background: #fdecea; color: #d64545; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .info-box { background: #eef4fb; color: #2C3E50; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .ok-box { background: #e6f4ea; color: #2e9e4f; padding: 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }

  .variant-card { background: var(--navy); color: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
  .variant-card .vk { font-size: 12px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.5px; }
  .variant-card .vv { font-size: 26px; font-weight: 700; margin-top: 4px; }

  .step { margin-bottom: 18px; }
  .step-title { font-size: 13.5px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
  .field-row { display: flex; gap: 10px; }
  .field-col { flex: 1; }
  .field-label { font-size: 12px; color: #888; margin-bottom: 4px; display: block; }
  .field-col input { margin-bottom: 0; }

  .center { text-align: center; }
  .spinner { width: 34px; height: 34px; border: 3px solid #eee; border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-row { margin-bottom: 14px; }
  .result-row .rq { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .result-cols { display: flex; gap: 10px; flex-wrap: wrap; }
  .result-col { flex: 1; min-width: 130px; }
  .result-col-label { font-size: 11px; color: #999; margin-bottom: 3px; }
  .result-box { padding: 8px 10px; background: #fafbfc; border: 1px solid #eee; border-radius: 8px; font-size: 14px; }
  .verdict { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin-top: 6px; }
  .verdict.ok { background: #e6f4ea; color: #2e9e4f; }
  .verdict.no { background: #fdecea; color: #d64545; }
</style>
</head>
<body>

<div class="wrap">

  <div id="screen-loading" class="center">
    <div class="spinner"></div>
    <div class="muted">Загрузка...</div>
  </div>

  <div id="screen-error" class="hidden">
    <h1>Не получилось</h1>
    <div class="error-box" id="error-text"></div>
  </div>

  <div id="screen-join" class="hidden">
    <h1 id="join-title"></h1>
    <div class="sub" id="join-intro"></div>
    <div class="info-box hidden" id="scheduled-banner"></div>
    <label class="field-label" style="display:block; margin-bottom:6px; font-weight:700; color:var(--navy);">Ф.И.О.</label>
    <input type="text" id="student-name" placeholder="Фамилия Имя" maxlength="60">
    <div class="error-box hidden" id="join-error"></div>
    <button class="btn" id="join-btn" onclick="joinTask()">Получить вариант</button>
  </div>

  <div id="screen-form" class="hidden">
    <h1 id="form-title"></h1>
    <div class="variant-card">
      <div class="vk" id="variant-kind"></div>
      <div class="vv" id="variant-value"></div>
    </div>

    <div id="methodology-box" class="info-box hidden" style="line-height:1.6;"></div>

    <button type="button" class="btn outline" id="table-toggle-btn" style="margin-bottom:14px;" onclick="toggleTable()">📐 Показать таблицу допусков</button>
    <div id="table-box" class="hidden" style="margin-bottom:18px; overflow-x:auto;"></div>

    <div class="step">
      <div class="step-title" id="step1-title"></div>
      <div class="field-row">
        <div class="field-col"><span class="field-label" id="lbl-devMax-um"></span><input type="text" id="devMaxUm" inputmode="decimal" placeholder="0"></div>
        <div class="field-col"><span class="field-label" id="lbl-devMin-um"></span><input type="text" id="devMinUm" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>

    <div class="step">
      <div class="step-title">2. Переведите в мм</div>
      <div class="field-row">
        <div class="field-col"><span class="field-label" id="lbl-devMax-mm"></span><input type="text" id="devMaxMm" inputmode="decimal" placeholder="0"></div>
        <div class="field-col"><span class="field-label" id="lbl-devMin-mm"></span><input type="text" id="devMinMm" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>

    <div class="step">
      <div class="step-title" id="step3-title"></div>
      <div class="field-row">
        <div class="field-col"><span class="field-label" id="lbl-limMax"></span><input type="text" id="limMaxMm" inputmode="decimal" placeholder="0"></div>
        <div class="field-col"><span class="field-label" id="lbl-limMin"></span><input type="text" id="limMinMm" inputmode="decimal" placeholder="0"></div>
      </div>
    </div>

    <div class="error-box hidden" id="submit-error"></div>

    <button class="btn navy" id="submit-btn" onclick="submitTask()">Сдать ответ</button>
  </div>

  <div id="screen-done" class="hidden">
    <div id="done-status"></div>
    <div id="result-items"></div>
  </div>

</div>

<script>
  const CODE = location.pathname.split('/').filter(Boolean).pop();
  const LS_KEY = 'toleranceParticipant_' + CODE;

  const state = { participantId: null, variant: null, labels: null };

  function showScreen(id) {
    ['screen-loading','screen-error','screen-join','screen-form','screen-done'].forEach(s => {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }
  function showError(msg) {
    document.getElementById('error-text').textContent = msg;
    showScreen('screen-error');
  }
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  async function init() {
    const savedId = localStorage.getItem(LS_KEY);
    if (savedId) {
      state.participantId = savedId;
      showScreen('screen-done');
      await checkResult();
      return;
    }
    try {
      const res = await fetch(`/api/tolerance-sessions/${CODE}/info`);
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 410) { showError('Задание завершено преподавателем.'); return; }
        if (data.error === 'TRIAL_ENDED' || data.error === 'BLOCKED') { showError(data.message || 'Доступ временно недоступен.'); return; }
        showError(res.status === 404 ? 'Сессия не найдена. Проверьте код или QR-код.' : (data.error || 'Ошибка загрузки.'));
        return;
      }
      document.getElementById('join-title').textContent = data.testTitle;
      document.getElementById('join-intro').textContent = data.intro || '';
      if (data.scheduledAt && data.scheduledAt > Date.now()) showScheduledBanner(data.scheduledAt);
      showScreen('screen-join');
    } catch (e) {
      showError('Не удалось подключиться. Проверьте интернет-соединение.');
    }
  }

  let scheduledPollTimer = null;
  function showScheduledBanner(scheduledAt) {
    const banner = document.getElementById('scheduled-banner');
    const dt = new Date(scheduledAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    banner.textContent = `⏰ Задание начнётся ${dt}. Страница обновится автоматически.`;
    banner.classList.remove('hidden');
    document.getElementById('join-btn').disabled = true;
    if (scheduledPollTimer) clearInterval(scheduledPollTimer);
    scheduledPollTimer = setInterval(async () => {
      if (Date.now() < scheduledAt) return;
      try {
        const res = await fetch(`/api/tolerance-sessions/${CODE}/info`);
        const data = await res.json();
        if (res.ok && (!data.scheduledAt || data.scheduledAt <= Date.now())) {
          clearInterval(scheduledPollTimer); scheduledPollTimer = null;
          banner.classList.add('hidden');
          document.getElementById('join-btn').disabled = false;
        }
      } catch (e) {}
    }, 5000);
  }

  async function joinTask() {
    const name = document.getElementById('student-name').value.trim();
    const errEl = document.getElementById('join-error');
    errEl.classList.add('hidden');
    if (!name) { errEl.textContent = 'Введите Ф.И.О.'; errEl.classList.remove('hidden'); return; }
    const btn = document.getElementById('join-btn');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/tolerance-sessions/${CODE}/join`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.message || data.error || 'Ошибка';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        if (data.error === 'NOT_STARTED' && data.scheduledAt) showScheduledBanner(data.scheduledAt);
        return;
      }
      state.participantId = data.participantId;
      state.variant = data.variant;
      state.labels = data.labels;
      renderForm(data);
      showScreen('screen-form');
    } catch (e) {
      errEl.textContent = 'Не удалось подключиться. Проверьте интернет-соединение.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
    }
  }

  function renderForm(data) {
    document.getElementById('form-title').textContent = data.testTitle;
    document.getElementById('variant-kind').textContent = data.variant.typeName;
    document.getElementById('variant-value').textContent = `Ø ${data.variant.nominal} ${data.variant.field}`;
    const L = data.labels;
    document.getElementById('step1-title').textContent = `1. Определите по таблице ${L.devMax} и ${L.devMin} (в мкм)`;
    document.getElementById('step3-title').textContent = `3. Рассчитайте предельные размеры (мм)`;
    document.getElementById('lbl-devMax-um').textContent = L.devMax + ' (мкм)';
    document.getElementById('lbl-devMin-um').textContent = L.devMin + ' (мкм)';
    document.getElementById('lbl-devMax-mm').textContent = L.devMax + ' (мм)';
    document.getElementById('lbl-devMin-mm').textContent = L.devMin + ' (мм)';
    document.getElementById('lbl-limMax').textContent = L.limMax + ' (мм)';
    document.getElementById('lbl-limMin').textContent = L.limMin + ' (мм)';

    const methodEl = document.getElementById('methodology-box');
    if (data.methodology && data.methodology.length) {
      methodEl.innerHTML = '<strong>Как выполнять:</strong><ol style="margin:8px 0 0 18px; padding:0;">' +
        data.methodology.map(s => `<li style="margin-bottom:4px;">${escapeHtml(s)}</li>`).join('') + '</ol>';
      methodEl.classList.remove('hidden');
    }

    if (data.table) renderToleranceTable(data.table, L);
  }

  function renderToleranceTable(table, L) {
    const box = document.getElementById('table-box');
    let html = '<table style="width:100%; border-collapse:collapse; font-size:13px;">';
    html += '<thead><tr>';
    html += '<th style="padding:6px 8px; border:1px solid #e5e5e5; background:#f4f4f4; text-align:left;">Размеры, мм</th>';
    table.fieldNames.forEach(f => {
      html += `<th colspan="2" style="padding:6px 8px; border:1px solid #e5e5e5; background:#f4f4f4; color:#2C3E50; text-align:center;">${escapeHtml(f)}</th>`;
    });
    html += '</tr><tr>';
    html += '<th style="padding:4px 8px; border:1px solid #e5e5e5; background:#fafafa;"></th>';
    table.fieldNames.forEach(f => {
      html += `<th style="padding:4px 6px; border:1px solid #e5e5e5; background:#fafafa; font-weight:400; font-size:11px;">${L.devMax}</th><th style="padding:4px 6px; border:1px solid #e5e5e5; background:#fafafa; font-weight:400; font-size:11px;">${L.devMin}</th>`;
    });
    html += '</tr></thead><tbody>';
    table.ranges.forEach((range, ri) => {
      const label = ri === 0 ? `От ${range[0]} до ${range[1]}` : `Свыше ${range[0]} до ${range[1]}`;
      html += '<tr>';
      html += `<td style="padding:6px 8px; border:1px solid #e5e5e5;">${label}</td>`;
      table.fieldNames.forEach(f => {
        const vals = table.rows[f][ri];
        const style = 'padding:6px; border:1px solid #e5e5e5; text-align:center;';
        html += `<td style="${style}">${vals[0] > 0 ? '+' : ''}${vals[0]}</td><td style="${style}">${vals[1] > 0 ? '+' : ''}${vals[1]}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }

  function toggleTable() {
    const box = document.getElementById('table-box');
    const btn = document.getElementById('table-toggle-btn');
    const willShow = box.classList.contains('hidden');
    box.classList.toggle('hidden', !willShow);
    btn.textContent = willShow ? '📐 Скрыть таблицу допусков' : '📐 Показать таблицу допусков';
  }

  async function submitTask() {
    const errEl = document.getElementById('submit-error');
    errEl.classList.add('hidden');
    const values = {
      devMaxUm: document.getElementById('devMaxUm').value.trim(),
      devMinUm: document.getElementById('devMinUm').value.trim(),
      devMaxMm: document.getElementById('devMaxMm').value.trim(),
      devMinMm: document.getElementById('devMinMm').value.trim(),
      limMaxMm: document.getElementById('limMaxMm').value.trim(),
      limMinMm: document.getElementById('limMinMm').value.trim()
    };
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/tolerance-sessions/${CODE}/submit`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participantId: state.participantId, values })
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || 'Не удалось отправить ответ. Попробуйте ещё раз.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        return;
      }
      localStorage.setItem(LS_KEY, state.participantId);
      showScreen('screen-done');
      await checkResult();
    } catch (e) {
      errEl.textContent = 'Не удалось подключиться. Проверьте интернет-соединение.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
    }
  }

  async function checkResult() {
    const statusEl = document.getElementById('done-status');
    const itemsEl = document.getElementById('result-items');
    try {
      const res = await fetch(`/api/tolerance-sessions/${CODE}/result?participantId=${encodeURIComponent(state.participantId)}`);
      const data = await res.json();
      if (!res.ok) {
        statusEl.innerHTML = `<div class="error-box">${data.error || 'Не удалось получить результат.'}</div>`;
        return;
      }
      const L = data.labels;
      statusEl.innerHTML = `
        <div class="variant-card">
          <div class="vk">${escapeHtml(data.variant.typeName)}</div>
          <div class="vv">Ø ${data.variant.nominal} ${escapeHtml(data.variant.field)}</div>
        </div>
        <div class="ok-box"><strong>Результат: ${data.score} / ${data.total}</strong></div>
      `;
      const rows = [
        [L.devMax + ' (мкм)', data.given.devMaxUm, data.correctAnswer.devMaxUm, data.correct.devMaxUm],
        [L.devMin + ' (мкм)', data.given.devMinUm, data.correctAnswer.devMinUm, data.correct.devMinUm],
        [L.devMax + ' (мм)', data.given.devMaxMm, data.correctAnswer.devMaxMm, data.correct.devMaxMm],
        [L.devMin + ' (мм)', data.given.devMinMm, data.correctAnswer.devMinMm, data.correct.devMinMm],
        [L.limMax + ' (мм)', data.given.limMaxMm, data.correctAnswer.limMaxMm, data.correct.limMaxMm],
        [L.limMin + ' (мм)', data.given.limMinMm, data.correctAnswer.limMinMm, data.correct.limMinMm]
      ];
      itemsEl.innerHTML = rows.map(([label, given, correct, ok]) => `
        <div class="result-row">
          <div class="rq">${escapeHtml(label)}</div>
          <div class="result-cols">
            <div class="result-col"><div class="result-col-label">Ваш ответ</div><div class="result-box">${given === null || given === undefined ? '(пусто)' : given}</div></div>
            <div class="result-col"><div class="result-col-label">Правильно</div><div class="result-box">${correct}</div></div>
          </div>
          <span class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Верно' : '✕ Неверно'}</span>
        </div>
      `).join('');
    } catch (e) {
      statusEl.innerHTML = `<div class="error-box">Не удалось подключиться. Обновите страницу.</div>`;
    }
  }

  init();
</script>
</body>
</html>
